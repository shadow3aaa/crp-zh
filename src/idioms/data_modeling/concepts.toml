[[questions]]
type = "MultipleChoice"
prompt.prompt = """
请考虑以下 C++ 程序。

```cpp
template<typename T>
struct Scaled {
	double scale;
	T shape;

	double area() const {
		return scale * shape.area();
	}
};

template <typename T>
void printArea(T &shape) {
	std::cout << shape.area() << std::endl;
}
```

下列哪一段代码最符合惯用 Rust 风格地翻译 `Scaled` 模板类？
"""
prompt.distractors = [
# 省略了 trait。
#
# 在 C++ 中，使用模板时不需要接口。
"""
```rust
struct Scaled<T> {
    scale: f64,
    shape: T,
}

impl<T> Scaled<T> {
    fn area(&self) -> f64 {
        self.scale * self.shape.area()
    }
}
```
""",
# trait 约束放错了位置。
#
# 在 C++ 中，概念约束可以合理地放在这里。
"""
```rust
trait Shape {
    fn area(&self) -> f64;
}

struct Scaled<T> {
    scale: f64,
    shape: T,
}

impl<T> Shape for Scaled<T> {
    fn area(&self) -> f64
    where
        T: Shape,
    {
        self.scale * self.shape.area()
    }
}
```
""",
# trait 约束放在了结构体上。
#
# 这会限制 Scaled 能用的类型，但在其他地方仍然需要约束。
"""
```rust
trait Shape {
    fn area(&self) -> f64;
}

struct Scaled<T: Shape> {
    scale: f64,
    shape: T,
}

impl<T> Shape for Scaled<T> {
    fn area(&self) -> f64 {
        self.scale * self.shape.area()
    }
}
```
""",
]
answer.answer = """
```rust
trait Shape {
    fn area(&self) -> f64;
}

struct Scaled<T> {
    scale: f64,
    shape: T,
}

impl<T: Shape> Shape for Scaled<T> {
    fn area(&self) -> f64 {
        self.scale * self.shape.area()
    }
}
```
"""
context = """
Rust 需要知道 `Scaled::shape` 的类型支持 `area` 方法，因此类型参数上必须有 trait 约束。Trait 的实现是“全有或全无”的，所以约束作用于整个实现块，而不是单独的方法。
"""
id = "3cb5759b-5fe0-491e-ac87-4ba455b26e8f"
