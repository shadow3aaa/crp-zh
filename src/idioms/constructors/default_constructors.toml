[[questions]]
type = "MultipleChoice"
prompt.prompt = """
这个程序能编译吗？如果不能，原因是什么？

```rust
struct Widget {
    color: String,
}

fn main() {
    let w: Widget;
    println!("{}", w.color);
}
```
"""
answer.answer = """
不能编译，因为 `w` 在使用前没有被显式初始化。
"""
prompt.distractors = [
# 认为 Rust 有类似 C++ 的隐式初始化和隐式默认构造函数。
"""
能编译。
""",
# 认为 Rust 有隐式默认初始化，但需要显式实现 Default。
"""
不能编译，因为 `Widget` 没有实现 `Default` trait。
""",
# 认为 Rust 有隐式默认初始化，但需要显式实现 new 方法。
"""
不能编译，因为 `Widget` 没有实现 `new` 方法。
""",
# 认为 Rust 有隐式默认初始化，但需要同时实现 Default 和 new（因为正文提到应实现二者）。
"""
不能编译，因为 `Widget` 没有同时实现 `Default` trait 和 `new` 方法。
"""
]
context = """
Rust 不像 C++ 那样有隐式默认初始化。变量在使用前必须显式初始化，否则程序无法编译。
"""
id = "5019323d-1534-4c70-a8e7-b015f87be228"

[[questions]]
type = "MultipleChoice"
prompt.prompt = """
以下 C++ 程序最地道的 Rust 翻译是哪一个？

```cpp
struct Vec2 {
    double x;
    double y;

    Vec2() : x(0.0), y(0.0) {}
};
```
"""
prompt.distractors = [
"""
```rust
pub struct Vec2 {
    pub x: f64;
    pub y: f64;
}

impl Vec2 {
     pub fn new() -> Self {
        Vec2 { x: 0.0, y: 0.0 }
     }
}
```
""",
"""
```rust
pub struct Vec2 {
    pub x: f64;
    pub y: f64;
}

impl Default for Vec2 {
     fn default() -> Self {
        Self::new()
     }
}
```
"""
]
answer.answer = """
```rust
pub struct Vec2 {
    pub x: f64;
    pub y: f64;
}

impl Vec2 {
     pub fn new() -> Self {
        Vec2 { x: 0.0, y: 0.0 }
     }
}

impl Default for Vec2 {
     fn default() -> Self {
        Self::new()
     }
}
```
"""
context = """
当存在合理的默认值时，Rust 最地道的做法是同时提供 [`new` 方法和实现 `Default` trait。](https://rust-lang.github.io/api-guidelines/interoperability.html?highlight=default#types-eagerly-implement-common-traits-c-common-traits)
"""
id = "a436177e-821d-45d1-8e46-4fafc3d78cd3"
