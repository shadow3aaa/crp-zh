[[questions]]
type = "MultipleChoice"
prompt.prompt = """
以下哪个 Rust 程序是对下述 C++ 程序最地道的翻译？

```cpp
#include <cmath>
#include <stdexcept>

class NotNaN {
  double value;

public:
  NotNaN(double x) : value(x) {
    if (std::isnan(value)) {
      throw std::domain_error("NaN");
    }
  }

  double getValue() {
    return value;
  }
};
```
"""
prompt.distractors = [
"""
```rust
pub struct NotNaN {
    value: f64,
}

impl NotNaN {
    pub fn value(&self) -> f64 {
        self.value
    }
}

impl From<f64> for NotNaN {
    fn from(x: f64) -> Self {
        if x.is_nan() {
            panic!("Is NaN!");
        }
        Self { value: x }
    }
}
```
""",
"""
```rust
use std::convert::TryInto;

pub struct NotNaN {
    value: f64,
}

impl NotNaN {
    pub fn value(&self) -> f64 {
        self.value
    }
}

#[derive(Clone, Copy, Debug)]
pub struct IsNaN;

impl TryInto<NotNaN> for f64 {
    type Error = IsNaN;

    fn try_into(
        self,
    ) -> Result<NotNaN, Self::Error> {
        if self.is_nan() {
            Err(IsNaN)
        } else {
            Ok(NotNaN { value: self })
        }
    }
}
```
"""
]
answer.answer = """
```rust
use std::convert::TryFrom;

pub struct NotNaN {
    value: f64,
}

impl NotNaN {
    pub fn value(&self) -> f64 {
        self.value
    }
}

#[derive(Clone, Copy, Debug)]
pub struct IsNaN;

impl TryFrom<f64> for NotNaN {
    type Error = IsNaN;
    fn try_from(
        x: f64,
    ) -> Result<Self, Self::Error> {
        if x.is_nan() {
            Err(IsNaN)
        } else {
            Ok(Self { value: x })
        }
    }
}
```
"""
context = """
对于每个实现了 `TryFrom` 的类型，Rust 都有一个通用的 `TryInto` 实现。因此，更推荐实现 `TryFrom`，并依赖于通用的 `TryInto` 实现。
"""
id = "d6790d33-5130-47ba-ba96-c6718978131f"
