[[questions]]
type = "Tracing"
prompt.program = """
struct SubWidget {
    id: i32,
}

impl Drop for SubWidget {
    // Prints the id and then sets it to 0
    fn drop(&mut self) {
        println!("{}", self.id);
        self.id = 0;
    }
}

struct Widget {
    id: i32,
    boxed_sub: Box<SubWidget>,
    sub: SubWidget,
}

impl Drop for Widget {
    // Prints the id and then sets it to 0
    fn drop(&mut self) {
        println!("{}", self.id);
        self.id = 0;
    }
}

fn passthrough(a: Widget) -> Widget {
    a
}

fn accept(a: Widget) {}

fn main() {
    let s1 = Box::new(SubWidget { id: 1 });
    let s2 = SubWidget { id: 2 };
    let w = Widget {
        id: 3,
        sub: s2,
        boxed_sub: s1,
    };
    let s3 = SubWidget { id: 4 };

    let w2 = passthrough(w);
}
"""
answer.doesCompile = true
answer.stdout = """
3
1
2
4
"""
context = """
对 `passthrough` 的调用会将 `w` 中的值的所有权移动到函数的参数中，然后在返回时再将所有权移出，因此最终 `w2` 拥有该值。这些步骤都不会导致调用 `drop`，因为没有已初始化的变量离开作用域。当所有权从 `w` 移动到参数，或从 `passthrough` 函数中的 `a` 移动到 `w2` 时，`w` 和 `a` 都变为未初始化状态。

在 `main` 结束时，`w2` 会最先被销毁，因为它是最后声明的。然后其成员会按照结构体定义中的声明顺序依次被销毁。每个字段在下一个字段销毁前会被完全析构，因此当字段 `boxed_sub` 中的 `Box` 被销毁时，它会先销毁其拥有的值，然后再销毁 `sub` 字段中的值。最后，`s3` 被销毁。

`w`、`s2` 和 `s1` 不会被销毁，因为它们没有被初始化。
"""
id = "9132e738-cc0b-4ba5-a323-9200b99bcbc4"