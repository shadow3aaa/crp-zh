[[questions]]
type = "MultipleChoice"
prompt.prompt = """
对于以下 C++ 抽象虚类，下面哪个代码片段最符合 Rust 的惯用写法？
```cpp
template<typename Item>
struct Iterable {
  Iterable() {};
  virtual ~Iterable() {};
  virtual Item* next() = 0;
};
```
"""
prompt.distractors = [
"""
```rust
struct Iterable<Item> {}
impl<Item> Iterable<Item> {
  fn next(&mut self) -> Option<Item>;
}
```
""",
"""
```rust
struct Iterable<Item> {
  fn next(&mut self) -> Option<Item>;
}
```
""",
"""
```rust
trait Iterable {
  type Item;
  fn new() -> Self;
  fn drop(self);
  fn next(&mut self) -> Option<Self::Item>;
}
```
""",
]
answer.answer = """
```rust
trait Iterable {
  type Item;
  fn next(&mut self) -> Option<Self::Item>;
}
```
"""
id = "507115c6-4ed1-4a16-9f40-f5a01d3830a8"
