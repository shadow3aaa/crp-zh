[[questions]]
type = "MultipleChoice"
prompt.prompt="""
以下 Rust 程序是对 C++ 程序的近似翻译。
关于它们，下列哪些说法是正确的？

C++:

```cpp
#include <iostream>

template <typename T>
void displayWithType(T t) {
  std::cout << "Unknown: " << t << std::endl;
}

template <>
void displayWithType<int>(int t) {
  std::cout << "int: " << t << std::endl;
}
```

Rust:

```rust
trait TypeDisplayName {
    fn type_display_name() -> &'static str {
        "Unknown"
    }
}

impl TypeDisplayName for i32 {
    fn type_display_name() -> &'static str {
        "i32"
    }
}

use std::fmt::Display;

fn display_with_type<T: TypeDisplayName + Display>(x: T) {
    println!("{}: {}", T::type_display_name(), x);
}
```
"""
prompt.distractors = [
"""
`displayWithType` 和 `display_with_type` 都会对除 `int` 或 `i32` 以外的所有类型显示 "Unknown type"。
""",
"""
`displayWithType` 和 `display_with_type` 都可以被任何重载了 `<<` 或实现了 `Display` 的类型调用。
"""
]
answer.answer = [
"""
`displayWithType` 和 `display_with_type` 只能被重载了 `<<` 或实现了 `Display` 的类型调用。
"""
]
context = """
> 都会对除 `int` 或 `i32` 以外的所有类型显示 "Unknown type"。

实际上，两者对于其他类型的显示内容取决于程序中其他地方的实现/特化。

> `displayWithType` 和 `display_with_type` 都可以被任何重载了 `<<` 或实现了 `Display` 的类型调用。

`DisplayWithType` trait 中 `type_display_name` 的默认实现并不意味着 `display_with_type` 可以被任意类型调用。类型仍需显式声明实现该 trait。
"""
id = "6ac15484-9038-45b7-9b47-f08918551d3a"

