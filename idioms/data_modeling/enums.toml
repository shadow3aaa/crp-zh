[[questions]]
type = "MultipleChoice"
prompt.prompt="""
以下哪一个 Rust 程序是对下面 C++ 程序最地道的翻译？

```cpp
#include <cstdint>
#include <iostream>

enum ColorImpl : uint8_t {
  Red,
  Blue,
  Green,
  Yellow,
};

struct InvalidColor {
  uint8_t color;
};

struct Color {
  ColorImpl color;

  Color(ColorImpl c) : color(c) {}

  operator ColorImpl() {
    return color;
  }

  explicit Color(uint8_t c) {
    if (c < Red || c > Yellow) {
      throw InvalidColor{c};
    }
    color = static_cast<ColorImpl>(c);
  }
};
```

所有 Rust 选项都以如下导入和定义开始。

```rust
use std::convert::TryFrom;

#[repr(i8)]
#[derive(Clone, Copy)]
enum Color {
    Red,
    Blue,
    Green,
    Yellow,
}

struct InvalidColor(u8);
```
"""
prompt.distractors= [
# 认为整数类型可以像 C++ 的 static_cast 一样直接转换为枚举类型。
"""
```rust
impl TryFrom<u8> for Color {
    type Error = InvalidColor;

    fn try_from(c: u8) -> Result<Self, InvalidColor> {
        match c {
            0 | 2 | 3 => Ok(c as Color),
            _ => Err(InvalidColor(c)),
        }
    }
}
```
""",
# 认为枚举需要像 C++ 那样用结构体包装以添加方法。
"""
```rust
#[derive(Clone, Copy)]
struct ColorWrapper {
    color: Color,
}

impl TryFrom<u8> for ColorWrapper {
    type Error = InvalidColor;

    fn try_from(c: u8) -> Result<Self, InvalidColor> {
        let color = match c {
            0 => Ok(Color::Red),
            1 => Ok(Color::Blue),
            2 => Ok(Color::Green),
            3 => Ok(Color::Yellow),
            _ => Err(InvalidColor(c)),
        }?;
        Ok(ColorWrapper { color })
    }
}
```
"""
]
answer.answer = """
```rust
impl TryFrom<u8> for Color {
    type Error = InvalidColor;

    fn try_from(c: u8) -> Result<Self, InvalidColor> {
        match c {
            0 => Ok(Color::Red),
            1 => Ok(Color::Blue),
            2 => Ok(Color::Green),
            3 => Ok(Color::Yellow),
            _ => Err(InvalidColor(c)),
        }
    }
}
```
"""
